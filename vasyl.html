<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bilder – Vasyl</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/game.css?v=93a6fad3" />
    <link rel="stylesheet" href="css/pictures.css?v=f321e968" />
    <script src="js/menu.js?v=20f97f17"></script>
    <script src="js/pictures.js?v=be31a6a3"></script>
  </head>
  <body>
    <nav id="menu" class="menu"></nav>
    <main id="game" class="pg-main"></main>
    <script>
      // Fifteen short picture levels (about a minute each), no reading needed.
      // Levels 1–7 are matching and placing puzzles like his worksheets,
      // 8–15 are other kinds: memory, odd one out, counting, jigsaw,
      // sorting, building and two mazes.
      // icon: shown in the progress bar; reward: shown when the level is done;
      // help: note for the adult who plays along (Vasyl doesn't read).
      PictureGame.start({
        id: 'vasyl',
        levels: [
          // Same pictures: draw a line from each picture to its twin.
          {
            type: 'connect',
            icon: '🎃',
            reward: '🍬',
            help:
              'Gleiche Bilder verbinden: ein Bild links antippen oder ziehen, ' +
              'dann sein Gegenstück rechts. Die Hand 👆 zeigt jeden Level ' +
              'einen Zug vor und wiederholt ihn nach 15 Sekunden Pause. ' +
              'Oben kann man zu jedem Level springen.',
            pairs: [
              ['🎃', '🎃'],
              ['👻', '👻'],
              ['🦇', '🦇'],
              ['🍭', '🍭'],
            ],
          },
          // Picture → its black shadow.
          {
            type: 'connect',
            icon: '👻',
            reward: '🍫',
            help: 'Jedes Bild zu seinem schwarzen Schatten ziehen.',
            pairs: [
              ['🦉', { e: '🦉', sil: true }],
              ['🍄', { e: '🍄', sil: true }],
              ['🧙', { e: '🧙', sil: true }],
              ['🏰', { e: '🏰', sil: true }],
            ],
          },
          // Who needs what? Put the thing in the empty box.
          {
            type: 'pairs',
            icon: '🦇',
            reward: '🍪',
            help: 'Wer braucht was? Das passende Ding unten in das leere Feld daneben ziehen.',
            pairs: [
              ['🐶', '🦴'],
              ['🕷️', '🕸️'],
              ['🐭', '🧀'],
              ['🧙', '🧹'],
            ],
          },
          // Which half is missing?
          {
            type: 'halves',
            icon: '🕷️',
            reward: '🧁',
            help: 'Welche Hälfte fehlt? Die rechte Hälfte von unten an die linke ziehen – dann ist das Bild ganz.',
            items: ['🎃', '🐸', '🍓', '🐝'],
          },
          // Shape sorter: every shape into its hole.
          {
            type: 'holes',
            icon: '🔮',
            reward: '🍩',
            help: 'Formen sortieren: jede Form in das Loch mit derselben Form.',
            items: [
              'shape:circle:#e34b4b',
              'shape:square:#5b9ee6',
              'shape:triangle:#2f9a6e',
              'shape:star:#ffc832',
              'shape:heart:#c23c7a',
              'shape:moon:#7a4fc4',
            ],
          },
          // What comes next? The last picture of each row goes in the box.
          {
            type: 'pattern',
            icon: '🧙',
            reward: '🍭',
            help: 'Was kommt als Nächstes? In jeder Reihe wiederholt sich ein Muster – das fehlende Bild in das leuchtende Feld ziehen.',
            rows: [
              ['🎃', '👻', '🎃', '👻', '🎃', '👻'],
              ['🦇', '🦇', '🍬', '🦇', '🦇', '🍬'],
              ['🍭', '🕷️', '🎃', '🍭', '🕷️', '🎃'],
            ],
            extra: ['🦇', '🍭'],
          },
          // From small to big.
          {
            type: 'holes',
            sizes: true,
            icon: '🍬',
            reward: '🎈',
            help: 'Von klein nach groß: die Kürbisse in die Löcher mit der passenden Größe stellen.',
            items: ['🎃', '🎃', '🎃', '🎃'],
          },
          // ----- Levels 8–15: new kinds of puzzles -----

          // Memory: turn over two cards; same pictures stay open.
          {
            type: 'memory',
            icon: '🎴',
            reward: '🍦',
            help:
              'Memory: zwei Karten umdrehen. Sind es gleiche Bilder, bleiben ' +
              'sie offen, sonst drehen sie sich wieder um.',
            items: ['🎃', '👻', '🦇', '🍬'],
          },
          // Odd one out.
          {
            type: 'odd',
            icon: '🔍',
            reward: '🍰',
            help:
              'Was passt nicht dazu? In jeder Reihe das eine andere Bild ' +
              'antippen.',
            rows: [
              ['🎃', '🎃', '🎃', '👻'],
              ['🦇', '🦇', '🦇', '🦉'],
              ['🍎', '🍌', '🍐', '🚗'],
              ['🐶', '🐱', '🐭', '🍕'],
            ],
          },
          // Counting: as many dots as pumpkins.
          {
            type: 'pairs',
            icon: '🎲',
            reward: '🍓',
            help:
              'Zählen: die Karte mit genauso vielen Punkten neben die ' +
              'Kürbisse ziehen.',
            pairs: [
              [
                { e: '🎃', n: 1 },
                { e: '🔴', n: 1 },
              ],
              [
                { e: '🎃', n: 2 },
                { e: '🔴', n: 2 },
              ],
              [
                { e: '🎃', n: 3 },
                { e: '🔴', n: 3 },
              ],
              [
                { e: '🎃', n: 4 },
                { e: '🔴', n: 4 },
              ],
            ],
          },
          // Jigsaw: four pieces make a picture.
          {
            type: 'jigsaw',
            icon: '🧩',
            reward: '🍿',
            help:
              'Puzzle: die vier Teile an die richtige Stelle ziehen, bis das ' +
              'Bild ganz ist. Die grauen Schatten zeigen, wo was hingehört.',
            items: ['🎃', '👻'],
          },
          // Sort by colour into two baskets.
          {
            type: 'sort',
            icon: '🧺',
            reward: '🍯',
            help:
              'Sortieren: alles Orange in den orangen Korb, alles Lila in ' +
              'den lila Korb.',
            groups: [
              { color: '#f08a24', items: ['🎃', '🍊', '🥕'] },
              { color: '#7a4fc4', items: ['🍇', '🍆', '☂️'] },
            ],
          },
          // Copy the tower (like his HABA stacking toy).
          {
            type: 'copy',
            icon: '🧱',
            reward: '🧃',
            help:
              'Nachbauen: rechts denselben Turm bauen wie links – von oben ' +
              'nach unten dieselben Bilder.',
            model: ['🦇', '👻', '🎃'],
            extra: ['🕷️', '🍬'],
          },
          // Maze: bring the ghost to the candy.
          {
            type: 'maze',
            icon: '🧛',
            reward: '🎁',
            help:
              'Labyrinth: das Gespenst zu den Süßigkeiten bringen – auf das ' +
              'Feld daneben tippen oder mit dem Finger den Weg entlang ' +
              'ziehen.',
            start: '👻',
            goal: '🍬',
            map: ['S..#.', '##.#.', '.....', '.###.', '...#G'],
          },
          // A big maze with many forks and dead ends. The last level.
          {
            type: 'maze',
            icon: '🏆',
            reward: '🏆',
            help:
              'Großes Labyrinth: die Fledermaus zum Kürbis bringen. Es gibt ' +
              'Sackgassen – dann einfach zurückgehen. Das ist der letzte ' +
              'Level!',
            start: '🦇',
            goal: '🎃',
            map: [
              'S#.........',
              '.#.#.#####.',
              '.#.#.#.....',
              '.###.###.##',
              '...#...#...',
              '##.#.#.###.',
              '...#.#.#.#.',
              '.#####.#.#.',
              '...#...#...',
              '##.#.###.##',
              '.....#....G',
            ],
          },
        ],
      });
    </script>
  </body>
</html>
