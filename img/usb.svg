<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- USB flash drive, tilted like an emoji -->
  <g transform="rotate(45 32 32)">
    <!-- metal connector -->
    <rect x="23" y="4" width="18" height="17" rx="2"
          fill="#d9dde3" stroke="#6b7480" stroke-width="2"/>
    <rect x="27.5" y="9" width="3.5" height="3.5" fill="#6b7480"/>
    <rect x="33" y="9" width="3.5" height="3.5" fill="#6b7480"/>
    <!-- body -->
    <rect x="18" y="19" width="28" height="41" rx="6"
          fill="#2f7bd0" stroke="#1d4f8a" stroke-width="2"/>
    <rect x="21.5" y="23" width="6" height="30" rx="3"
          fill="#fff" opacity=".3"/>
    <!-- key ring hole -->
    <circle cx="32" cy="53" r="3" fill="#1d4f8a"/>
  </g>
</svg>
