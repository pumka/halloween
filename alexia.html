<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rätsel – Alexia</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/game.css?v=d6938d17" />
    <script src="js/menu.js?v=20f97f17"></script>
    <script src="js/engine.js?v=a213caec"></script>
  </head>
  <body>
    <nav id="menu" class="menu"></nav>
    <main id="game"></main>
    <script>
      const R = LogicGame.rules;
      LogicGame.start({
        id: 'alexia',
        title: 'Das verrückte Geisterlabor',
        intro:
          'Wer arbeitet in welchem Labor, mit welchem Gegenstand ' +
          'und an welchem Ort?',

        // Columns (positions from left to right).
        // "links"/"rechts" in the rules refers to these.
        columns: [
          { label: 'Labor 1', icon: '🚪' },
          { label: 'Labor 2', icon: '🚪' },
          { label: 'Labor 3', icon: '🚪' },
          { label: 'Labor 4', icon: '🚪' },
        ],

        // Rows: every row needs exactly one item per column.
        // Names must be unique. A "|" marks where a long name may wrap
        // (e.g. 'Schrecke|schnecke'); rules use the name without it.
        rows: [
          {
            label: 'Wissenschaftler',
            items: [
              { name: 'Toten|kopf', icon: '💀' },
              { name: 'Schnarch|geist', icon: '👻' },
              { name: 'Wackel|zahn', icon: '🦷' },
              { name: 'Hexen|schuss', icon: '🧙' },
            ],
          },
          {
            label: 'Gegenstand',
            items: [
              { name: 'Ordner', icon: '📁' },
              { name: 'Kamm', icon: '🪮' },
              { name: 'Pinsel', icon: '🖌️' },
              { name: 'Spiegel', icon: '🪞' },
            ],
          },
          {
            label: 'Ort',
            items: [
              { name: 'Home pool', icon: '🛁' },
              { name: 'Letter box', icon: '📬' },
              { name: 'Clothes house', icon: '👗' },
              { name: 'Pee chair', icon: '🚽' },
            ],
          },
        ],

        // Already placed when the game starts: [name, column number].
        given: [['Schnarchgeist', 2]],

        // Rules: text for the kids + check.
        // Item names in the text get highlighted automatically.
        // Helpers: same, notSame, leftOf, rightOf, directlyLeftOf,
        //          directlyRightOf, nextTo, notNextTo, inColumn, notInColumn,
        //          atEdge, notAtEdge, between, all, any, not
        // Custom:  check: s => s.col('Kamm') > 2
        rules: [
          {
            text:
              'Schnarchgeist hat seinen Gegenstand in der Letter box ' +
              'vergessen.',
            check: R.same('Schnarchgeist', 'Letter box'),
          },
          {
            text: 'Rechts von der Letter box liegt der Pinsel.',
            check: R.directlyRightOf('Pinsel', 'Letter box'),
          },
          {
            text: 'Der Pinsel liegt weder im Home pool noch auf dem Pee chair.',
            check: R.all(
              R.notSame('Pinsel', 'Home pool'),
              R.notSame('Pinsel', 'Pee chair'),
            ),
          },
          {
            text:
              'Totenkopf und Hexenschuss hassen einander und befinden sich ' +
              'so weit wie möglich voneinander entfernt.',
            // One in the first column, the other in the last.
            check: s =>
              Math.abs(s.col('Totenkopf') - s.col('Hexenschuss')) === 3,
          },
          {
            text: 'Neben dem Pinsel liegen der Kamm und der Spiegel.',
            check: R.all(
              R.nextTo('Kamm', 'Pinsel'),
              R.nextTo('Spiegel', 'Pinsel'),
            ),
          },
          {
            text: 'Der Pee chair befindet sich nicht neben der Letter box.',
            check: R.notNextTo('Pee chair', 'Letter box'),
          },
          {
            text: 'Totenkopf wäscht sich fünfmal am Tag.',
            // He is at the Home pool (the bathtub).
            check: R.same('Totenkopf', 'Home pool'),
          },
          {
            text: 'Der Kamm gehört nicht Hexenschuss.',
            check: R.notSame('Kamm', 'Hexenschuss'),
          },
        ],

        // Creature in the top-left cell: spider, bat, pumpkin or ghost.
        mascot: 'spider',

        // Scientist whose column is the key for the next puzzle. It blinks
        // when the puzzle is solved; the sentence is shown in the
        // completion box (tools/check.js checks it matches the column).
        keyColumn: 'Totenkopf',
        keySentence: 'Totenkopf sortiert den Ordner im Home pool.',

        winEmoji: '🧪',
        winTitle: 'Rätsel gelöst!',
        winMessage: 'Toll gemacht! Das Abenteuer geht weiter …',
      });
    </script>
  </body>
</html>
