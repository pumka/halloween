<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rätsel – Alexia</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/game.css?v=b8dc9c4c" />
    <script src="js/menu.js?v=730d5bbb"></script>
    <script src="js/engine.js?v=d087f042"></script>
  </head>
  <body>
    <nav id="menu" class="menu"></nav>
    <main id="game"></main>
    <script>
      const R = LogicGame.rules;
      LogicGame.start({
        id: 'alexia',
        title: 'Das verrückte Geisterlabor',
        intro:
          'Wer arbeitet in welchem Labor, mit welchem Gegenstand ' +
          'und an welchem Ort?',

        // Columns (positions from left to right).
        // "links"/"rechts" in the rules refers to these.
        columns: [
          { label: 'Labor 1', icon: '🚪' },
          { label: 'Labor 2', icon: '🚪' },
          { label: 'Labor 3', icon: '🚪' },
          { label: 'Labor 4', icon: '🚪' },
        ],

        // Rows: every row needs exactly one item per column.
        // Names must be unique. A "|" marks where a long name may wrap
        // (e.g. 'Schrecke|schnecke'); rules use the name without it.
        rows: [
          {
            label: 'Wissenschaftler',
            items: [
              { name: 'Toten|kopf', icon: '💀' },
              { name: 'Schnarch|geist', icon: '👻' },
              { name: 'Wackel|zahn', icon: '🦷' },
              { name: 'Hexen|schuss', icon: '🧙' },
            ],
          },
          {
            label: 'Gegenstand',
            items: [
              { name: 'Ordner', icon: '📁' },
              { name: 'Kamm', icon: '🪮' },
              { name: 'Pinsel', icon: '🖌️' },
              { name: 'Spiegel', icon: '🪞' },
            ],
          },
          {
            label: 'Ort',
            items: [
              { name: 'Home pool', icon: 'img/pool.svg' },
              { name: 'Letter box', icon: '🔤' },
              { name: 'Clothes house', icon: '👗' },
              { name: 'Pee chair', icon: '🪑' },
            ],
          },
        ],

        // Already placed when the game starts: [name, column number].
        given: [['Schnarchgeist', 2]],

        // Rules: text for the kids + check.
        // Item names in the text get highlighted automatically.
        // Helpers: same, notSame, leftOf, rightOf, directlyLeftOf,
        //          directlyRightOf, nextTo, notNextTo, inColumn, notInColumn,
        //          atEdge, notAtEdge, between, all, any, not
        // Custom:  check: s => s.col('Kamm') > 2
        rules: [
          {
            text: 'Totenkopf sortiert den Ordner.',
            check: R.same('Totenkopf', 'Ordner'),
          },
          {
            text: 'Der Ordner schwimmt im Home pool.',
            check: R.same('Ordner', 'Home pool'),
          },
          {
            text: 'Hexenschuss sitzt auf dem Pee chair.',
            check: R.same('Hexenschuss', 'Pee chair'),
          },
          {
            text: 'Der Pee chair steht ganz rechts.',
            check: R.inColumn('Pee chair', 4),
          },
          {
            text: 'Wackelzahn arbeitet direkt links neben Hexenschuss.',
            check: R.directlyLeftOf('Wackelzahn', 'Hexenschuss'),
          },
          {
            text: 'Wackelzahn malt mit dem Pinsel.',
            check: R.same('Wackelzahn', 'Pinsel'),
          },
          {
            text: 'Der Kamm liegt direkt links neben dem Pinsel.',
            check: R.directlyLeftOf('Kamm', 'Pinsel'),
          },
          {
            text: 'Die Letter box steht neben dem Home pool.',
            check: R.nextTo('Letter box', 'Home pool'),
          },
        ],

        // Creature in the top-left cell: spider, bat, pumpkin or ghost.
        mascot: 'spider',

        // Scientist whose column is the key for the next puzzle. It blinks
        // when the puzzle is solved; the sentence is shown in the
        // completion box (tools/check.js checks it matches the column).
        keyColumn: 'Wackelzahn',
        keySentence: 'Wackelzahn malt mit dem Pinsel im Clothes house.',

        winEmoji: '🧪',
        winTitle: 'Rätsel gelöst!',
        winMessage: 'Toll gemacht! Das Abenteuer geht weiter …',
      });
    </script>
  </body>
</html>
