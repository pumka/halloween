<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rätsel – Oleksii</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/game.css?v=5d313dd2" />
    <script src="js/menu.js?v=730d5bbb"></script>
    <script src="js/engine.js?v=5850fe67"></script>
  </head>
  <body>
    <nav id="menu" class="menu"></nav>
    <main id="game"></main>
    <script>
      const R = LogicGame.rules;
      LogicGame.start({
        id: 'oleksii',
        title: 'Die Monster-Werkstatt',
        intro:
          'Wer arbeitet in welchem Labor, mit welchem Gegenstand ' +
          'und an welchem Ort?',

        // Columns (positions from left to right).
        // "links"/"rechts" in the rules refers to these.
        columns: [
          { label: 'Labor 1', icon: '🚪' },
          { label: 'Labor 2', icon: '🚪' },
          { label: 'Labor 3', icon: '🚪' },
          { label: 'Labor 4', icon: '🚪' },
        ],

        // Rows: every row needs exactly one item per column.
        // Names must be unique. A "|" marks where a long name may wrap
        // (e.g. 'Schrecke|schnecke'); rules use the name without it.
        rows: [
          {
            label: 'Wissenschaftler',
            items: [
              { name: 'Gift|maker', icon: '🧪' },
              { name: 'Zitter|hand', icon: '🖐️' },
              { name: 'Hirn|schmalz', icon: '🧠' },
              { name: 'Gänse|haut', icon: '🥶' },
            ],
          },
          {
            label: 'Gegenstand',
            items: [
              { name: 'Brille', icon: '👓' },
              { name: 'Heft', icon: '📓' },
              { name: 'USB', icon: 'img/usb.svg' },
              { name: 'Würfel', icon: '🎲' },
            ],
          },
          {
            label: 'Ort',
            items: [
              { name: 'Cold closet', icon: 'img/fridge.svg' },
              { name: 'Hot box', icon: 'img/oven.svg' },
              { name: 'Clothes swimmer', icon: 'img/washer.svg' },
              { name: 'Dry clothes box', icon: 'img/dryer.svg' },
            ],
          },
        ],

        // Already placed when the game starts: [name, column number].
        given: [
          ['Hirnschmalz', 3],
          ['Würfel', 4],
        ],

        // Rules: text for the kids + check.
        // Item names in the text get highlighted automatically.
        // Helpers: same, notSame, leftOf, rightOf, directlyLeftOf,
        //          directlyRightOf, nextTo, notNextTo, inColumn, notInColumn,
        //          atEdge, notAtEdge, between, all, any, not
        // Custom:  check: s => s.col('Kamm') > 2
        rules: [
          {
            text:
              'Professor Giftmaker und Professor Gänsehaut hassen einander ' +
              'und befinden sich so weit wie möglich voneinander entfernt.',
            // One in the first column, the other in the last.
            check: s => Math.abs(s.col('Giftmaker') - s.col('Gänsehaut')) === 3,
          },
          {
            text:
              'Der Professor links von Professor Hirnschmalz vergisst ' +
              'ständig alles und trägt deshalb immer ein Heft bei sich.',
            check: R.directlyLeftOf('Heft', 'Hirnschmalz'),
          },
          {
            text:
              'Die beiden Orte, an denen Kleidung behandelt wird, befinden ' +
              'sich rechts. Zuerst ist die Kleidung nass, danach trocken.',
            check: R.all(
              R.inColumn('Clothes swimmer', 3),
              R.inColumn('Dry clothes box', 4),
            ),
          },
          {
            text:
              'Der Professor rechts von Giftmaker ist sehr zerstreut und ' +
              'könnte seinen Gegenstand sogar in die Hot box legen.',
            check: R.directlyRightOf('Hot box', 'Giftmaker'),
          },
          {
            text:
              'Professor Hirnschmalz hat diesen Gegenstand einmal zufällig ' +
              'mitgewaschen. Seltsamerweise blieben alle darauf ' +
              'gespeicherten Daten erhalten.',
            check: R.same('Hirnschmalz', 'USB'),
          },
        ],

        // Creature in the top-left cell: spider, bat, pumpkin or ghost.
        mascot: 'ghost',

        // Scientist whose column is the key for the next puzzle. It blinks
        // when the puzzle is solved; the sentence is shown in the
        // completion box (tools/check.js checks it matches the column).
        keyColumn: 'Giftmaker',
        keySentence: 'Giftmaker trägt die Brille im Cold closet.',

        winEmoji: '🧪',
        winTitle: 'Rätsel gelöst!',
        winMessage: 'Toll gemacht! Das Abenteuer geht weiter …',
      });
    </script>
  </body>
</html>
